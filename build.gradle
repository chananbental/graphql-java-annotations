
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

apply plugin: 'idea'


// custom tasks for creating source/javadoc jars
tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

repositories {
    mavenCentral()
}

// Preserve Java parameter names for annotation-based argument discovery.
// Compiler arguments must be set before compilation, not in a doLast action.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
    options.release = 17
}

dependencies {
    implementation 'javax.validation:validation-api:1.1.0.Final'
    api 'com.graphql-java:graphql-java:26.1'
    api 'com.graphql-java:graphql-java-extended-scalars:24.0'
    implementation 'javax.xml.bind:jaxb-api:2.3.1'

    // OSGi
    compileOnly 'org.osgi:org.osgi.core:6.0.0'
    compileOnly 'org.osgi:org.osgi.service.cm:1.5.0'
    compileOnly 'org.osgi:org.osgi.service.component:1.3.0'
    compileOnly 'org.osgi:org.osgi.service.component.annotations:1.3.0'
    testCompileOnly 'org.osgi:org.osgi.service.component.annotations:1.3.0'
    compileOnly 'biz.aQute.bnd:biz.aQute.bndlib:3.2.0'

    testImplementation 'org.testng:testng:7.5.1'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
    testImplementation 'org.mockito:mockito-core:5.+'
}

test.useTestNG()

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId 'io.github.graphql-java'
            artifactId project.name
            version project.version

            artifact sourcesJar
            artifact javadocJar

            pom.withXml {
                asNode().children().last() + {
                    resolveStrategy = Closure.DELEGATE_FIRST
                    name 'graphql-java-annotations'
                    description 'Annotations-based syntax for GraphQL schema definition'
                    url 'https://github.com/graphql-java/graphql-java-annotations'
                    inceptionYear '2016'

                    scm {
                        url 'https://github.com/graphql-java/graphql-java-annotations'
                        connection 'scm:https://yrashk@github.com/graphql-java/graphql-java-annotations.git'
                        developerConnection 'scm:git://github.com/graphql-java/graphql-java-annotations.git'
                    }

                    licenses {
                        license {
                            name 'The Apache Software License, Version 2.0'
                            url 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution 'repo'
                        }
                    }

                    developers {
                        developer {
                            id 'yrashk'
                            name 'Yurii Rashkovskii'
                            email 'yrashk@gmail.com'
                        }
                        developer {
                            id 'apottere'
                            name 'Andrew Potter'
                            email 'Andrew.Potter@coxautoinc.com'
                        }
                        developer {
                            id 'bbakerman'
                            name 'Brad Baker'
                            email 'bbakerman@gmail.com'
                        }
                        developer {
                            id 'yarinvak'
                            name 'Yarin Vaknin'
                            email 'yarinvak@gmail.com'
                        }
                        developer {
                            id 'guy120494'
                            name 'Guy Smorodinsky'
                        }
                        developer {
                            id 'osher-sade'
                            name 'Osher Sade'
                        }
                    }
                }
            }
        }
    }
}


// to publish to local maven repo skip signing: ./gradlew publishToMavenLocal  -x signGraphqlJavaPublication
signing {
    def signingKey = System.getenv("MAVEN_CENTRAL_PGP_KEY")
    def signingPassword = System.getenv("MAVEN_CENTRAL_PGP_PASSWORD")
    useInMemoryPgpKeys(signingKey, signingPassword == null ? "" : signingPassword)
    // Do not attach missing signature artifacts to local/CI publications.
    // Signing remains required for release publication when a key is provided.
    if (signingKey) {
        sign publishing.publications
    }
}


wrapper {
    gradleVersion = '9.2.1'
}
