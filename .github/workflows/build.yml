# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build

on: [push, pull_request]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validation:
    name: "Gradle Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v3
  build:
    needs:
      - validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and verify Maven publication with Gradle
        run: ./gradlew build publishToMavenLocal centralBundle
      - name: Verify Central bundle layout
        run: |
          python3 - <<'PY'
          import glob, zipfile
          bundles = glob.glob('build/distributions/central-bundle-*.zip')
          assert len(bundles) == 1, bundles
          with zipfile.ZipFile(bundles[0]) as archive:
              names = archive.namelist()
              prefix = 'io/github/chananbental/graphql-java-annotations/'
              assert any(name.startswith(prefix) and name.endswith('.pom') for name in names), names
              assert any(name.startswith(prefix) and name.endswith('.jar') for name in names), names
              assert any(name.startswith(prefix) and name.endswith('-sources.jar') for name in names), names
              assert any(name.startswith(prefix) and name.endswith('-javadoc.jar') for name in names), names
              print('Central bundle Maven layout verified:', bundles[0])
          PY
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
